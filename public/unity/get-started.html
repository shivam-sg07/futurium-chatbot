<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Started Demo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }
        .content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            font-family: Arial, sans-serif;
        }
        h1 {
            font-size: 48px;
            margin: 0;
            animation: slideIn 1s ease-out;
        }
        .box {
            width: 150px;
            height: 150px;
            background: rgba(255, 255, 255, 0.3);
            margin: 30px auto;
            animation: bounce 2s ease-in-out infinite;
        }
        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-30px); }
        }
    </style>
</head>
<body>
    <canvas id="webglCanvas"></canvas>
    <div class="content">
        <h1>Get Started!</h1>
        <div class="box"></div>
        <p style="font-size: 24px;">Ready to chat?</p>
    </div>
    <script src="get-started.js"></script>
</body>
</html>
