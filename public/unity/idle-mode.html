<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idle Mode Demo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }
        .content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            font-family: Arial, sans-serif;
        }
        h1 {
            font-size: 48px;
            margin: 0;
            animation: pulse 2s ease-in-out infinite;
        }
        .circle {
            width: 200px;
            height: 200px;
            border: 5px solid white;
            border-radius: 50%;
            margin: 30px auto;
            animation: rotate 3s linear infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <canvas id="webglCanvas"></canvas>
    <div class="content">
        <h1>Idle Mode</h1>
        <div class="circle"></div>
        <p style="font-size: 24px;">Waiting for interaction...</p>
    </div>
    <script src="idle-mode.js"></script>
</body>
</html>
